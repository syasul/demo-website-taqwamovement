[program:taqwamovement-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demo-taqwamovement/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/demo-taqwamovement/storage/logs/supervisor-queue.log
stopwaitsecs=3600
